<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación ElectroLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Great Vibes', cursive;
            color: white;
        }

        /* 1. FUEGOS ARTIFICIALES */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 2. TELÓN */
        .curtain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 1000;
            pointer-events: none;
        }

        .door {
            width: 50%;
            height: 100%;
            background: repeating-linear-gradient(to right, #800000, #b30000 15px, #660000 30px);
            box-shadow: inset 0 0 100px #000;
            transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .opened .door-left {
            transform: translateX(-100%);
        }

        .opened .door-right {
            transform: translateX(100%);
        }

        /* 3. TARJETA */
        .tarjeta {
            position: relative;
            z-index: 10;
            width: 90vw;
            max-width: 380px;
            height: 90vh;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            animation: fadeInCard 1.5s forwards 1.5s;
        }

        .tarjeta::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('images/fondo.jpg') center/cover no-repeat;
            opacity: 0.5;
            z-index: -1;
        }

        /* 4. LOGOS - CORREGIDOS */
        .logo-img {
            height: 90px;
            /* Altura fija para asegurar visibilidad */
            width: auto;
            object-fit: contain;
            flex-shrink: 0;
            /* EVITA QUE EL TEXTO LO APLASTE */
            opacity: 0;
            z-index: 20;
            animation: fadeIn 1s forwards 2.5s;
        }

        /* 5. CONTENIDO */
        .contenido-central {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 100%;
            opacity: 0;
            animation: fadeIn 1s forwards 3.5s;
        }

        .shake-text {
            display: inline-block;
            animation: shake 0.6s infinite;
        }

        h1 {
            font-size: 38px;
            text-shadow: 2px 2px 10px #000;
            color: #ffd700;
            margin-bottom: 5px;
        }

        p {
            font-size: 24px;
            line-height: 1.1;
        }

        .nombre-profe {
            font-size: 34px;
            color: #fff;
            margin: 5px 0;
        }

        button {
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-family: 'Great Vibes', cursive;
            font-size: 20px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        /* ANIMACIONES */
        @keyframes fadeInCard {
            to {
                opacity: 1;
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            25% {
                transform: translate(-1px, -1px) rotate(-0.5deg);
            }

            50% {
                transform: translate(-2px, 0px) rotate(0.5deg);
            }

            75% {
                transform: translate(2px, 1px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -1px) rotate(0.5deg);
            }
        }
    </style>
</head>

<body onload="iniciarSecuencia()">

    <canvas id="fireworksCanvas"></canvas>
    <audio id="aplausos" src="https://www.soundjay.com/human/applause-01.mp3"></audio>

    <div class="curtain-container" id="curtain">
        <div class="door door-left"></div>
        <div class="door door-right"></div>
    </div>

    <div class="tarjeta">
        <img src="images/logo1.png" alt="Logo 1" class="logo-img">

        <div class="contenido-central">
            <h1 class="shake-text">Invitación Especial</h1>
            <p id="tituloNombre"></p>
            <div id="nombreInvitado" class="nombre-profe shake-text">Nombre Del Profesor</div>
            <p>Presentación de:</p>
            <div class="shake-text" style="font-size: 34px; color: #00d4ff;">💡 ElectroLearn</div>
            <p>📅 16 de mayo, 2026<br>⏰ 11:00 a.m.</p>
            <div>
                <button onclick="confirmar()">Confirmar asistencia</button>
            </div>
        </div>

        <img src="images/logo2.jpg" alt="Logo 2" class="logo-img">
    </div>

    <script>
        function iniciarSecuencia() {
            setTimeout(() => {
                document.getElementById('curtain').classList.add('opened');
                iniciarFuegos();
            }, 500);
        }

        function confirmar() {
            alert("¡Asistencia confirmada!");
            document.getElementById('aplausos').play();
        }

        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.alpha = 1;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI * 2); ctx.fill();
            }
            update() { this.x += this.vx; this.y += this.vy; this.alpha -= 0.015; }
        }

        function spawnExplosion() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.7);
            const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
            for (let i = 0; i < 40; i++) particles.push(new Particle(x, y, color));
        }

        function iniciarFuegos() {
            function animate() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, i) => {
                    if (p.alpha <= 0) particles.splice(i, 1);
                    else { p.update(); p.draw(); }
                });
                requestAnimationFrame(animate);
            }
            animate();
            setInterval(spawnExplosion, 600);
        }

        const urlParams = new URLSearchParams(window.location.search);

        const invitados = [{
            nombre: "Ing. Rosario",
            tituloNombre: "Estimada Directora"

        },
        {
            nombre: "Lic. Armando Mena",
            tituloNombre: "Estimado subdirector"

        },
        {
            nombre: "Lic. David López Ariste",
            tituloNombre: "Estimado profesor"
        }
        ]

        // 2. Leer un valor
        const idInvitado = urlParams.get('idInvitado');
        const cotenedorNombre = document.getElementById("nombreInvitado");
        const contendorTituloNombre = document.getElementById("tituloNombre")
        cotenedorNombre.textContent = invitados[idInvitado].nombre
        contendorTituloNombre.textContent = invitados[idInvitado].tituloNombre

    </script>
</body>

</html>
